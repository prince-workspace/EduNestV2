<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — EduNest</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar">
    <a href="/index.html" class="brand">🎓 <span>EduNest</span></a>
    <div class="nav-links">
      <a href="/register.html" class="btn btn-outline btn-sm">Create Account</a>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <h2>Welcome Back</h2>
      <p class="subtitle">Sign in to continue your personalized learning path</p>

      <div style="margin-bottom: 1.25rem; padding: 0.65rem 0.95rem; background: #eff6ff; border: 1.5px solid #bfdbfe; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; font-size: 0.84rem;">
        <span style="color: #1e40af; font-weight: 600;">🔗 Local MySQL Mode</span>
        <button type="button" onclick="promptBackendUrl()" style="background: #2563eb; color: #ffffff; border: none; padding: 0.35rem 0.8rem; border-radius: 6px; font-size: 0.76rem; font-weight: 700; cursor: pointer;">
          ⚙ Connect Backend URL
        </button>
      </div>

      <div id="errorMsg" class="alert alert-error hidden"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          Sign In
        </button>
      </form>

      <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        New to EduNest? <a href="/register.html" style="color: var(--primary); font-weight: 600;">Register here</a>
      </p>

      <div style="text-align: center; margin-top: 1rem;">
        <button type="button" onclick="promptBackendUrl()" style="background: none; border: none; color: #64748b; font-size: 0.78rem; cursor: pointer; text-decoration: underline;">
          ⚙ Backend Server Settings
        </button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
