<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assessment Results — EduNest</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-active-nav="quizzes">
  <div class="app-shell">
    <!-- Left Sidebar -->
    <aside class="app-sidebar" id="sidebarMount"></aside>

    <!-- Main Area -->
    <div class="app-main">
      <header class="app-topbar">
        <div class="topbar-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="globalSearchInput" placeholder="Search..." />
        </div>
        <div class="topbar-user">
          <div class="topbar-status">
            <span class="topbar-status-dot"></span>
            <span>Online</span>
          </div>
          <a href="/student/profile.html" class="user-avatar-chip" style="text-decoration:none; color:inherit;">
            <div class="user-avatar-circle" id="topUserInitials">ST</div>
            <span id="topUserName">Student</span>
          </a>
        </div>
      </header>

      <main class="app-content">
        <div class="dashboard-header" style="background:#ffffff; border:1px solid #eef2f6; border-radius:14px; padding:1.25rem 1.5rem; margin-bottom:1.25rem;">
          <div>
            <span class="card-question">Assessment Performance Summary</span>
            <h2 id="resultQuizTitle" style="margin-top: 0.25rem;">Assessment Results</h2>
            <p style="color: var(--text-muted); font-size: 0.88rem; margin-top:0.2rem;">
              Overall Score: <strong id="overallScoreDisplay" style="color: var(--primary); font-size: 1.05rem;">--</strong>
            </p>
          </div>
          <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
            <a id="backToCourseBtn" href="/student/courses.html" class="btn btn-primary btn-sm">Back to Course Syllabus</a>
            <a href="/student/practices.html" class="btn btn-outline btn-sm">Practice More Topics</a>
          </div>
        </div>

        <!-- Dedicated Final Assessment Outcome Card -->
        <div id="finalAssessmentResultCard" style="display:none; margin-bottom: 1.5rem;"></div>

        <h3 style="margin-bottom: 0.75rem; font-size:1.1rem; color:#0f172a;">Topic-Level Strength &amp; Weakness Breakdown</h3>
        <div id="topicBreakdownGrid" class="grid-2" style="margin-bottom: 2rem;"></div>

        <h3 style="margin-bottom: 0.75rem; font-size:1.1rem; color:#0f172a;">Detailed Question &amp; Explanation Review</h3>
        <div id="answerReviewContainer"></div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/quiz.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth('STUDENT')) return;
      loadQuizResult();
    });
  </script>
</body>
</html>
