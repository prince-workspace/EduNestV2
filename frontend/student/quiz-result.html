<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Performance Analysis — EduNest</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar">
    <a href="/student/dashboard.html" class="brand">🎓 <span>EduNest</span></a>
    <div class="nav-links">
      <a href="/student/dashboard.html">Dashboard</a>
      <a href="/student/courses.html">Courses</a>
      <a href="/student/knowledge-profile.html">Knowledge Profile</a>
      <a href="/student/learning-path.html">Learning Path</a>
      <span class="badge badge-student">ANALYSIS</span>
      <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="container">
    <div class="dashboard-header">
      <div>
        <span class="card-question">Diagnostic &amp; Quiz Performance Analysis</span>
        <h2 id="resultQuizTitle" style="margin-top: 0.25rem;">Assessment Results</h2>
        <p style="color: var(--text-muted); font-size: 0.95rem;">
          Overall Score: <strong id="overallScoreDisplay" style="color: var(--primary); font-size: 1.1rem;">--</strong>
        </p>
      </div>
      <div style="display:flex; gap:0.65rem; flex-wrap:wrap;">
        <a href="/student/knowledge-profile.html" class="btn btn-outline btn-sm">Knowledge Profile</a>
        <a href="/student/learning-path.html" class="btn btn-primary btn-sm">Personalized Learning Path →</a>
        <a id="backToCourseBtn" href="/student/courses.html" class="btn btn-outline btn-sm">Course Syllabus</a>
      </div>
    </div>

    <h3 style="margin-bottom: 1rem;">Topic-Level Strength &amp; Weakness Breakdown</h3>
    <div id="topicBreakdownGrid" class="grid-2" style="margin-bottom: 2.5rem;"></div>

    <h3 style="margin-bottom: 1rem;">Detailed Question &amp; Explanation Review</h3>
    <div id="answerReviewContainer"></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/quiz.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth('STUDENT')) return;
      loadQuizResult();
    });
  </script>
</body>
</html>
