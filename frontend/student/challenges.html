<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical Challenges - EduNest</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar"></nav>

    <main class="container">
        <div class="card" style="margin-bottom: 1.5rem;">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
                <div>
                    <h1>Practical Coding Challenges</h1>
                    <p style="color:#64748b;">Unlock hands-on coding &amp; debugging tasks by reaching <strong>90%+ Mastery (Gold)</strong> on a topic.</p>
                </div>
                <a href="/student/skill-map.html" class="btn btn-outline">View Skill Map</a>
            </div>
        </div>

        <div id="challengesList" style="display:flex; flex-direction:column; gap:1rem; margin-bottom:2rem;">
            <p>Loading challenges...</p>
        </div>

        <div class="card">
            <h2 style="margin-bottom:1rem;">My Submissions</h2>
            <div id="submissionsList">
                <p style="color:#64748b;">Loading submissions...</p>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/skill-map.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            requireAuth('STUDENT');
            loadChallengesHub();
        });
    </script>
</body>
</html>
