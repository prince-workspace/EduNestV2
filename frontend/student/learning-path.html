<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personalized Learning Path — EduNest</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar">
    <a href="/student/dashboard.html" class="brand">🎓 <span>EduNest</span></a>
    <div class="nav-links">
      <a href="/student/dashboard.html">Dashboard</a>
      <a href="/student/courses.html">Courses</a>
      <a href="/student/knowledge-profile.html">Knowledge Profile</a>
      <a href="/student/learning-path.html" class="active">Learning Path</a>
      <span class="badge badge-student">STUDENT</span>
      <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="container">
    <div class="dashboard-header">
      <div>
        <span class="card-question">Rule-Based Adaptive Recommendation Engine</span>
        <h2 style="margin-top: 0.25rem;">Your Personalized Learning Path</h2>
        <p style="color: var(--text-muted); font-size: 0.92rem; margin-top: 0.25rem;">
          Prioritizes Weak topics (&lt;40%) with Lesson + Practice + Quiz before advancing to higher topics.
        </p>
      </div>
      <a href="/student/knowledge-profile.html" class="btn btn-outline btn-sm">← View Knowledge Profile</a>
    </div>

    <div id="learningPathContainer"></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/mastery.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth('STUDENT')) return;
      loadLearningPathPage();
    });
  </script>
</body>
</html>
