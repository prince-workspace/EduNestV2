<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard — EduNest</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .welcome-banner-clean {
      background: #ffffff;
      border: 1px solid #eef2f6;
      border-radius: 18px;
      padding: 1.5rem 1.75rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.02);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.25rem;
    }
    .welcome-banner-clean-left {
      max-width: 650px;
    }
    .welcome-greeting-tag {
      font-size: 0.78rem;
      font-weight: 700;
      color: #2563eb;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.35rem;
    }
    .welcome-title-clean {
      font-size: 1.75rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.025em;
      margin: 0 0 0.35rem 0;
      line-height: 1.2;
    }
    .welcome-subtitle-clean {
      font-size: 0.92rem;
      color: #64748b;
      margin: 0;
      line-height: 1.5;
    }
    .goal-pill-card-clean {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 0.65rem 1rem;
      display: inline-flex;
      align-items: center;
      gap: 0.85rem;
      margin-top: 1rem;
    }
    .goal-pill-card-clean .goal-label {
      font-size: 0.68rem;
      color: #94a3b8;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .goal-pill-card-clean .goal-val {
      font-size: 0.88rem;
      font-weight: 700;
      color: #1e293b;
    }
    .goal-edit-link {
      font-size: 0.8rem;
      font-weight: 600;
      color: #2563eb;
      text-decoration: none;
      margin-left: 0.5rem;
    }
    .goal-edit-link:hover {
      text-decoration: underline;
    }
    .dash-two-cols-clean {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.35rem;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 860px) {
      .dash-two-cols-clean {
        grid-template-columns: 1fr;
      }
    }
    .dash-panel-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 1.4rem 1.6rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.02);
    }
    .dash-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .dash-panel-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .dash-badge-pill {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
    }
    .dash-badge-pill.blue {
      background: #eff6ff;
      color: #1d4ed8;
    }
    .dash-badge-pill.amber {
      background: #fffbeb;
      color: #b45309;
    }
    .dash-badge-pill.green {
      background: #ecfdf5;
      color: #047857;
    }
    .review-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid #f1f5f9;
      gap: 0.75rem;
    }
    .review-item-row:last-child {
      border-bottom: none;
    }
    .review-item-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: #1e293b;
    }
    .review-item-sub {
      font-size: 0.78rem;
      color: #64748b;
      margin-top: 0.15rem;
    }
    .btn-review-mini {
      background: #eff6ff;
      color: #2563eb;
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .btn-review-mini:hover {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }
  </style>
</head>
<body data-active-nav="dashboard">
  <div class="app-shell">
    <!-- Left Sidebar -->
    <aside class="app-sidebar" id="sidebarMount"></aside>

    <!-- Main Area -->
    <div class="app-main">
      <!-- Topbar -->
      <header class="app-topbar">
        <div class="topbar-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="globalSearchInput" placeholder="Search courses or topics..." />
        </div>
        <div class="topbar-user">
          <div class="topbar-status">
            <span class="topbar-status-dot"></span>
            <span>Online</span>
          </div>
          <a href="/student/profile.html" class="user-avatar-chip" style="text-decoration:none; color:inherit;">
            <div class="user-avatar-circle" id="topUserInitials">ST</div>
            <span id="topUserName">Student</span>
          </a>
        </div>
      </header>

      <!-- Main Dashboard Content -->
      <main class="app-content">
        <!-- Section 1: Welcome Strip -->
        <section class="welcome-banner-clean">
          <div class="welcome-banner-clean-left">
            <div class="welcome-greeting-tag" id="greetingTime">WELCOME BACK 👋</div>
            <h1 class="welcome-title-clean" id="welcomeText">Welcome back!</h1>
            <p class="welcome-subtitle-clean" id="welcomeSubtext">
              Track your learning progress, continue active lessons, and complete daily reviews.
            </p>

            <!-- Learning Goal Pill -->
            <div class="goal-pill-card-clean" id="goalPillCard">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.3">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="currentColor"/>
              </svg>
              <div>
                <div class="goal-label">TARGET LEARNING GOAL</div>
                <div class="goal-val" id="currentGoalDisplay">Master Web Development &amp; Programming</div>
              </div>
              <a href="/student/profile.html" class="goal-edit-link">Edit &rarr;</a>
            </div>
          </div>
        </section>

        <!-- Dynamic Container: Either Enrolled Dashboard OR Zero-Enrollment Onboarding -->
        <div id="dashboardMainArea">
          <!-- Populated dynamically -->
        </div>

        <!-- Section 3: Your Courses -->
        <section class="your-courses-card" id="yourCoursesSection" style="margin-top: 1.5rem;">
          <div class="your-courses-header">
            <div class="your-courses-title">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
              <span id="yourCoursesHeading">Your Courses</span>
            </div>
            <a href="/student/courses.html" style="font-size:0.88rem; font-weight:600; color:var(--primary); text-decoration:none;">
              View Course Catalog &rarr;
            </a>
          </div>

          <div class="your-courses-grid" id="yourCoursesRow">
            <!-- Populated dynamically -->
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/sidebar.js"></script>
  <script>
    // Immediate synchronous binding from localStorage to eliminate any UI flashing
    (function initLocalUser() {
      const storedName = localStorage.getItem('edunest_name') || 'Student';
      const firstName = storedName.split(' ')[0] || 'Student';
      const initials = storedName.split(' ').map(p => p[0]).join('').substring(0, 2).toUpperCase() || 'ST';
      const storedGoal = localStorage.getItem('edunest_goal');

      const welcomeEl = document.getElementById('welcomeText');
      if (welcomeEl) welcomeEl.textContent = `Welcome back, ${firstName}!`;

      const topNameEl = document.getElementById('topUserName');
      if (topNameEl) topNameEl.textContent = storedName;

      const topInitialsEl = document.getElementById('topUserInitials');
      if (topInitialsEl) topInitialsEl.textContent = initials;

      const goalEl = document.getElementById('currentGoalDisplay');
      if (goalEl) {
        goalEl.textContent = storedGoal || 'Set your learning goal in Profile';
      }

      const hr = new Date().getHours();
      const greetEl = document.getElementById('greetingTime');
      if (greetEl) {
        greetEl.textContent = hr < 12 ? 'GOOD MORNING 👋' : hr < 17 ? 'GOOD AFTERNOON 👋' : 'GOOD EVENING 👋';
      }
    })();

    async function loadDashboard() {
      if (!requireAuth('STUDENT')) return;

      try {
        // Fetch current authenticated user details
        const me = await apiFetch('/auth/me').catch(() => null);
        if (me) {
          const fullName = me.name || localStorage.getItem('edunest_name') || 'Student';
          const firstName = fullName.split(' ')[0] || 'Student';
          const initials = fullName.split(' ').map(p => p[0]).join('').substring(0, 2).toUpperCase() || 'ST';

          document.getElementById('welcomeText').textContent = `Welcome back, ${firstName}!`;
          document.getElementById('topUserName').textContent = fullName;
          document.getElementById('topUserInitials').textContent = initials;

          const goalEl = document.getElementById('currentGoalDisplay');
          if (goalEl) {
            goalEl.textContent = me.learningGoal || localStorage.getItem('edunest_goal') || 'Set your learning goal in Profile';
          }
        }

        // Fetch enrolled courses and pending revisions in parallel
        const [myCourses, pendingRevisions] = await Promise.all([
          apiFetch('/courses/my').catch(() => []),
          apiFetch('/students/me/revision-schedule?onlyPending=true').catch(() => [])
        ]);

        const mainArea = document.getElementById('dashboardMainArea');

        // Check if student has enrolled courses
        if (!myCourses || myCourses.length === 0) {
          renderZeroEnrollmentState(mainArea);
          await renderAvailableCoursesRow();
          return;
        }

        // Student has active courses -> render 2-column layout (Continue Learning + Due for Review)
        renderActiveDashboard(mainArea, myCourses, pendingRevisions);
        renderEnrolledCoursesRow(myCourses);

      } catch (err) {
        console.error('Error loading student dashboard:', err);
      }
    }

    async function renderActiveDashboard(container, myCourses, pendingRevisions) {
      const primaryCourse = myCourses[0];
      localStorage.setItem('edunest_activeCourseId', primaryCourse.id);

      // Load primary course details and completed lessons in parallel
      let courseDetail = null;
      let completedIds = [];
      try {
        [courseDetail, completedIds] = await Promise.all([
          apiFetch(`/courses/${primaryCourse.id}`),
          apiFetch(`/lessons/completed?courseId=${primaryCourse.id}`).catch(() => [])
        ]);
      } catch (e) {
        console.error('Error fetching course or completed lessons for dashboard:', e);
      }

      const completedSet = new Set(Array.isArray(completedIds) ? completedIds : []);
      const topics = (courseDetail && courseDetail.topics) ? courseDetail.topics : [];

      let nextLesson = null;
      let nextTopic = null;
      let totalLessons = 0;
      let completedLessonsCount = 0;

      // Scan all topics and lessons in curriculum order to find the next unfinished lesson
      for (const t of topics) {
        const topicLessons = t.lessons || [];
        for (const l of topicLessons) {
          totalLessons++;
          if (completedSet.has(l.id)) {
            completedLessonsCount++;
          } else if (!nextLesson) {
            nextLesson = l;
            nextTopic = t;
          }
        }
      }

      let continueTitle = '';
      let continueDesc = '';
      let lessonUrl = '';
      let buttonText = 'Start Learning &rarr;';
      let metaLessonLabel = '';
      let practiceLink = '/student/practices.html';

      if (nextLesson) {
        continueTitle = nextLesson.title;
        continueDesc = nextTopic 
          ? `${nextTopic.title} • Topic ${nextTopic.orderIndex || 1}`
          : 'Study this lesson to advance your course progress.';
        lessonUrl = `/student/lesson.html?id=${nextLesson.id}&courseId=${primaryCourse.id}`;
        buttonText = 'Continue Learning &rarr;';
        metaLessonLabel = `Lesson ${completedLessonsCount + 1} of ${totalLessons} (${nextLesson.estimatedMinutes || 15} mins)`;
        if (nextTopic) {
          practiceLink = `/student/practice.html?topicId=${nextTopic.id}`;
        }
      } else if (totalLessons > 0) {
        // All lessons completed
        continueTitle = 'All Curriculum Lessons Completed! 🎓';
        continueDesc = `You've completed all ${totalLessons} lessons. Take the Final Course Assessment to earn your verified certificate!`;
        lessonUrl = `/student/course-detail.html?id=${primaryCourse.id}`;
        buttonText = 'Take Final Assessment &rarr;';
        metaLessonLabel = `${totalLessons}/${totalLessons} Lessons Finished (100%)`;
      } else {
        // Fallback if no lessons are found
        continueTitle = primaryCourse.title;
        continueDesc = 'Explore the course curriculum and lessons.';
        lessonUrl = `/student/course-detail.html?id=${primaryCourse.id}`;
        buttonText = 'Start Learning &rarr;';
        metaLessonLabel = 'Curriculum';
      }

      // Revision items
      const revCount = (pendingRevisions && Array.isArray(pendingRevisions)) ? pendingRevisions.length : 0;
      let reviewContentHtml = '';

      if (revCount === 0) {
        reviewContentHtml = `
          <div style="padding: 1.5rem 0; text-align: center;">
            <div style="font-size: 2rem; margin-bottom: 0.5rem;">🎉</div>
            <div style="font-weight: 700; color: #0f172a; margin-bottom: 0.25rem;">All caught up!</div>
            <p style="color: #64748b; font-size: 0.88rem; margin: 0 0 1rem 0;">No revision tasks due right now. Spaced repetition keeps your skills fresh.</p>
            <a href="/student/practices.html" class="btn btn-outline btn-sm">Explore Practices &rarr;</a>
          </div>
        `;
      } else {
        const topRevisions = pendingRevisions.slice(0, 3);
        reviewContentHtml = `
          <div style="display:flex; flex-direction:column; margin-bottom:1rem;">
            ${topRevisions.map(r => `
              <div class="review-item-row">
                <div>
                  <div class="review-item-title">${r.topicTitle}</div>
                  <div class="review-item-sub">${r.dueOrOverdue ? '⚠️ Due today' : 'Upcoming review'} · Stage ${r.intervalStage || 1}</div>
                </div>
                <a href="/student/revision.html" class="btn-review-mini">Review &rarr;</a>
              </div>
            `).join('')}
          </div>
          <div style="text-align:right;">
            <a href="/student/revision.html" style="font-size:0.85rem; font-weight:600; color:var(--primary); text-decoration:none;">
              View All Revision Tasks (${revCount}) &rarr;
            </a>
          </div>
        `;
      }

      container.innerHTML = `
        <div class="dash-two-cols-clean">
          <!-- Card 1: Continue Learning -->
          <div class="dash-panel-card">
            <div>
              <div class="dash-panel-header">
                <div class="dash-panel-title">
                  <span class="dot-indicator blue"></span>
                  <span>Continue Learning</span>
                </div>
                <span class="dash-badge-pill blue">${primaryCourse.title}</span>
              </div>

              <div class="up-next-box" style="margin-top:0.5rem;">
                <span class="lesson-tag">${primaryCourse.title}</span>
                <div class="next-lesson-title" style="margin-top:0.4rem;">${continueTitle}</div>
                <p class="next-lesson-desc" style="margin-top:0.35rem;">${continueDesc}</p>
                <div class="lesson-meta" style="margin-top:0.75rem;">
                  <span class="meta-item">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <span>${metaLessonLabel}</span>
                  </span>
                  <span class="meta-dot">&bull;</span>
                  <span class="meta-item">
                    <a href="${practiceLink}" style="color:var(--primary); text-decoration:none; font-weight:600;">Practice Available</a>
                  </span>
                </div>
              </div>
            </div>

            <div style="margin-top: 1.25rem; display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center;">
              <a href="${lessonUrl}" class="btn-start-lesson" style="flex: 1; min-width: 170px; text-align: center;">
                ${buttonText}
              </a>
              <a href="/student/course-detail.html?id=${primaryCourse.id}" class="btn btn-outline" style="padding: 0.75rem 1.15rem; font-weight: 600; border-radius: 12px; white-space: nowrap;" title="View Course Syllabus & Modules">
                View Syllabus &rarr;
              </a>
            </div>
          </div>

          <!-- Card 2: Due for Review -->
          <div class="dash-panel-card">
            <div>
              <div class="dash-panel-header">
                <div class="dash-panel-title">
                  <span class="dot-indicator ${revCount > 0 ? 'amber' : 'green'}"></span>
                  <span>Due for Review</span>
                </div>
                <span class="dash-badge-pill ${revCount > 0 ? 'amber' : 'green'}">
                  ${revCount > 0 ? `${revCount} Pending` : 'Up to Date'}
                </span>
              </div>

              ${reviewContentHtml}
            </div>

            <div style="padding-top: 0.75rem; border-top: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center;">
              <span style="font-size: 0.8rem; color: #64748b;">Spaced repetition system</span>
              <a href="/student/revision.html" class="btn btn-outline btn-sm">Open Revision</a>
            </div>
          </div>
        </div>
      `;
    }

    function renderEnrolledCoursesRow(myCourses) {
      const container = document.getElementById('yourCoursesRow');
      const headingEl = document.getElementById('yourCoursesHeading');
      if (headingEl) headingEl.textContent = 'Your Enrolled Courses';

      const getIcon = (title = '') => {
        const t = title.toLowerCase();
        if (t.includes('python')) return { cls: 'python', emoji: '🐍' };
        if (t.includes('web') || t.includes('javascript')) return { cls: 'web', emoji: '🌐' };
        if (t.includes('data') || t.includes('sql')) return { cls: 'db', emoji: '🗄️' };
        return { cls: 'java', emoji: '☕' };
      };

      container.innerHTML = myCourses.map(c => {
        const icon = getIcon(c.title);
        const count = c.topicCount || 4;
        const isCompleted = Boolean(c.completed);
        return `
          <a href="/student/course-detail.html?id=${c.id}" class="course-mini-card" style="${isCompleted ? 'border-color:#86efac; background:#f0fdf4;' : ''}">
            <div class="course-mini-icon ${icon.cls}">${icon.emoji}</div>
            <div class="course-mini-body">
              <div class="course-mini-name" style="display:flex; align-items:center; justify-content:space-between; gap:0.4rem;">
                <span>${c.title}</span>
                ${isCompleted ? `<span class="badge" style="background:#ecfdf5; color:#047857; font-size:0.7rem; font-weight:700; padding:0.12rem 0.45rem; border:1px solid #a7f3d0; border-radius:999px;">✓ Completed</span>` : ''}
              </div>
              <div class="course-mini-sub" style="margin-top:0.4rem;">${isCompleted ? `Course Completed &bull; Final Score: ${c.finalScore || 100}%` : `${count} Curriculum Topics Available`}</div>
            </div>
            <span class="circle-chevron-btn">&rsaquo;</span>
          </a>
        `;
      }).join('');
    }

    function renderZeroEnrollmentState(container) {
      const storedName = localStorage.getItem('edunest_name') || 'Student';
      const firstName = storedName.split(' ')[0] || 'Student';

      container.innerHTML = `
        <div class="card" style="text-align: center; padding: 3rem 1.5rem; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; margin-bottom: 1.5rem;">
          <div style="font-size: 2.75rem; margin-bottom: 0.75rem;">🎓</div>
          <h2 style="font-size: 1.45rem; color: #0f172a; margin-bottom: 0.5rem;">Welcome to EduNest, ${firstName}!</h2>
          <p style="color: #64748b; font-size: 0.95rem; max-width: 520px; margin: 0 auto 1.5rem auto; line-height: 1.55;">
            You haven't enrolled in any courses yet. Explore our course catalog to find your first course, study interactive lessons, and practice with quizzes.
          </p>
          <div style="display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap;">
            <a href="/student/courses.html" class="btn btn-primary" style="padding: 0.65rem 1.4rem;">Browse Course Catalog &rarr;</a>
            <a href="/student/profile.html" class="btn btn-outline" style="padding: 0.65rem 1.4rem;">Set Learning Goal</a>
          </div>
        </div>
      `;
    }

    async function renderAvailableCoursesRow() {
      const headingEl = document.getElementById('yourCoursesHeading');
      if (headingEl) headingEl.textContent = 'Explore Recommended Courses';

      const container = document.getElementById('yourCoursesRow');
      try {
        const courses = await apiFetch('/courses').catch(() => []);
        if (!courses || courses.length === 0) {
          container.innerHTML = `<p style="color:var(--text-muted);">No published courses available.</p>`;
          return;
        }

        const getIcon = (title = '') => {
          const t = title.toLowerCase();
          if (t.includes('python')) return { cls: 'python', emoji: '🐍' };
          if (t.includes('web') || t.includes('javascript')) return { cls: 'web', emoji: '🌐' };
          if (t.includes('data') || t.includes('sql')) return { cls: 'db', emoji: '🗄️' };
          return { cls: 'java', emoji: '☕' };
        };

        container.innerHTML = courses.slice(0, 3).map(c => {
          const icon = getIcon(c.title);
          return `
            <a href="/student/course-detail.html?id=${c.id}" class="course-mini-card">
              <div class="course-mini-icon ${icon.cls}">${icon.emoji}</div>
              <div class="course-mini-body">
                <div class="course-mini-name">${c.title}</div>
                <div class="course-mini-sub" style="margin-top:0.4rem;">Click to explore &amp; enroll</div>
              </div>
              <span class="circle-chevron-btn">&rsaquo;</span>
            </a>
          `;
        }).join('');
      } catch (e) {
        console.error(e);
      }
    }

    document.addEventListener('DOMContentLoaded', loadDashboard);
  </script>
</body>
</html>
