<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solve Challenge - EduNest</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/student/dashboard.html" class="navbar-brand">EduNest</a>
        <div class="nav-links">
            <a href="/student/dashboard.html">Dashboard</a>
            <a href="/student/skill-map.html">Skill Map</a>
            <a href="/student/challenges.html" class="active">Challenges</a>
            <button onclick="logout()" class="btn btn-secondary">Logout</button>
        </div>
    </nav>

    <main class="container" style="margin-top: 2rem;">
        <div style="margin-bottom:1rem;">
            <a href="/student/challenges.html" style="color:#4f46e5; text-decoration:none; font-weight:600;">&larr; Back to Practical Challenges</a>
        </div>

        <div class="card" style="margin-bottom:1.5rem;">
            <div id="challengeMeta" style="font-size:0.85rem; font-weight:600; color:#6366f1; margin-bottom:0.35rem;">Loading...</div>
            <h1 id="challengeTitle" style="margin-bottom:0.75rem;">Challenge Workspace</h1>
            <p id="challengeDescription" style="color:#334155; font-size:1.05rem; line-height:1.6;"></p>
        </div>

        <div class="card">
            <h3 style="margin-bottom:0.75rem;">Your Java Solution</h3>
            <div id="submissionResult" style="display:none; margin-bottom:1rem;"></div>
            <form id="challengeSubmitForm">
                <div class="form-group">
                    <textarea id="solutionText" rows="12" style="width:100%; font-family:monospace; font-size:0.95rem; padding:1rem; background:#0f172a; color:#f8fafc; border-radius:8px; border:1px solid #334155;" required></textarea>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:0.75rem; margin-top:1rem;">
                    <a href="/student/challenges.html" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Submit &amp; Verify Solution</button>
                </div>
            </form>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/skill-map.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            requireAuth('STUDENT');
            loadChallengeDetail();
        });
    </script>
</body>
</html>
