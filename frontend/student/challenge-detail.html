<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coding Challenge Workspace — EduNest</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .challenge-grid {
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 1.25rem;
      align-items: start;
    }
    @media (max-width: 1024px) {
      .challenge-grid {
        grid-template-columns: 1fr;
      }
    }
    .spec-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 1.5rem;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.03);
    }
    .spec-section-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-top: 1.25rem;
      margin-bottom: 0.4rem;
    }
    .example-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 0.9rem 1.1rem;
      margin-bottom: 0.85rem;
      font-size: 0.88rem;
    }
    .example-box pre {
      margin: 0.35rem 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #0f172a;
      background: #ffffff;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      font-size: 0.85rem;
    }
    .editor-wrapper {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.08);
    }
    .editor-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      padding: 0.65rem 1rem;
      border-bottom: 1px solid #334155;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .code-editor-textarea {
      width: 100%;
      min-height: 380px;
      background: #0f172a;
      color: #f8fafc;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.92rem;
      line-height: 1.6;
      padding: 1.15rem 1.25rem;
      border: none;
      outline: none;
      resize: vertical;
      box-sizing: border-box;
      tab-size: 4;
    }
    .console-panel {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 1.25rem 1.5rem;
      margin-top: 1.25rem;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.03);
    }
    .testcase-tab {
      padding: 0.4rem 0.85rem;
      font-size: 0.82rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      background: #f1f5f9;
      color: #475569;
      transition: all 0.15s ease;
    }
    .testcase-tab.active {
      background: #eff6ff;
      color: #2563eb;
      border-color: #bfdbfe;
    }
    .testcase-tab.passed {
      color: #059669;
      background: #ecfdf5;
      border-color: #a7f3d0;
    }
    .testcase-tab.failed {
      color: #dc2626;
      background: #fef2f2;
      border-color: #fecdd3;
    }
  </style>
</head>
<body data-active-nav="challenges">
  <div class="app-shell">
    <!-- Left Sidebar -->
    <aside class="app-sidebar" id="sidebarMount"></aside>

    <!-- Main Area -->
    <div class="app-main">
      <header class="app-topbar">
        <div class="topbar-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="globalSearchInput" placeholder="Search challenges or syntax..." />
        </div>
        <div class="topbar-user">
          <div class="topbar-status">
            <span class="topbar-status-dot"></span>
            <span>Online</span>
          </div>
          <a href="/student/profile.html" class="user-avatar-chip" style="text-decoration:none; color:inherit;">
            <div class="user-avatar-circle" id="topUserInitials">ST</div>
            <span id="topUserName">Student</span>
          </a>
        </div>
      </header>

      <main class="app-content">
        <!-- Breadcrumb / Back Link -->
        <div style="margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
          <a href="/student/challenges.html" style="color:var(--primary); text-decoration:none; font-weight:600; font-size:0.88rem; display:inline-flex; align-items:center; gap:0.35rem;">
            &larr; Back to Coding Challenges Hub
          </a>
          <div id="challengeStatusPill" style="display:flex; align-items:center; gap:0.5rem;"></div>
        </div>

        <!-- 2-Column Problem & Code Workspace -->
        <div class="challenge-grid">
          <!-- Column 1: Problem Description, Constraints & Input/Output Examples -->
          <div class="spec-card">
            <div style="display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.4rem; flex-wrap: wrap;">
              <span id="chTopicBadge" class="badge" style="background:#eff6ff; color:#2563eb; font-weight:700;">Topic</span>
              <span id="chDifficultyBadge" class="badge" style="background:#fef3c7; color:#b45309; font-weight:700;">EASY</span>
              <span id="chPointsBadge" class="badge" style="background:#f1f5f9; color:#475569; font-weight:700;">50 pts</span>
            </div>

            <h2 id="chTitle" style="font-size: 1.45rem; font-weight: 800; color: #0f172a; margin: 0.25rem 0 0.85rem 0;">
              Loading Challenge...
            </h2>

            <div id="chDescription" style="color: #334155; font-size: 0.94rem; line-height: 1.65; white-space: pre-line;"></div>

            <div class="spec-section-title">Input Format</div>
            <div id="chInputFormat" style="font-size: 0.88rem; color: #475569; background: #f8fafc; padding: 0.65rem 0.9rem; border-radius: 8px; border: 1px solid #e2e8f0;"></div>

            <div class="spec-section-title">Output Format</div>
            <div id="chOutputFormat" style="font-size: 0.88rem; color: #475569; background: #f8fafc; padding: 0.65rem 0.9rem; border-radius: 8px; border: 1px solid #e2e8f0;"></div>

            <div class="spec-section-title">Constraints</div>
            <div id="chConstraints" style="font-size: 0.86rem; color: #475569; font-family: monospace; background: #f8fafc; padding: 0.65rem 0.9rem; border-radius: 8px; border: 1px solid #e2e8f0; white-space: pre-line;"></div>

            <div class="spec-section-title">Sample Examples</div>
            <div id="chExamplesContainer"></div>
          </div>

          <!-- Column 2: Interactive Code Editor & Test Console -->
          <div>
            <div class="editor-wrapper">
              <div class="editor-toolbar">
                <div style="display:flex; align-items:center; gap:0.6rem;">
                  <label for="languageSelect" style="color:#94a3b8; font-size:0.8rem; font-weight:700; text-transform:uppercase;">Language:</label>
                  <select id="languageSelect" style="background:#0f172a; color:#f8fafc; border:1px solid #334155; border-radius:6px; padding:0.35rem 0.75rem; font-size:0.85rem; font-weight:600; outline:none; cursor:pointer;" onchange="handleLanguageChange()">
                    <option value="JAVA">Java (JDK 24)</option>
                    <option value="PYTHON">Python (3.14)</option>
                    <option value="JAVASCRIPT">JavaScript (Node.js)</option>
                  </select>
                </div>
                <div style="display:flex; gap:0.5rem; align-items:center;">
                  <button type="button" onclick="resetStarterTemplate()" class="btn btn-outline btn-sm" style="color:#94a3b8; border-color:#334155; font-size:0.78rem; padding:0.25rem 0.6rem;">
                    ↺ Reset Code
                  </button>
                </div>
              </div>

              <!-- Monospace Code Editor -->
              <textarea id="codeEditor" class="code-editor-textarea" spellcheck="false" placeholder="// Write your solution here..."></textarea>
            </div>

            <!-- Run & Submit Actions Toolbar -->
            <div style="margin-top: 0.85rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem;">
              <span id="editorStatusText" style="font-size:0.84rem; color:#64748b;">Standard I/O Solution Editor</span>
              <div style="display: flex; gap: 0.6rem; align-items: center;">
                <button id="runCodeBtn" type="button" class="btn btn-outline" style="border-color:#cbd5e1; font-weight:700; display:inline-flex; align-items:center; gap:0.4rem;" onclick="runCode()">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                  <span>Run Code</span>
                </button>
                <button id="submitCodeBtn" type="button" class="btn btn-primary" style="font-weight:700; display:inline-flex; align-items:center; gap:0.4rem; padding:0.6rem 1.4rem;" onclick="submitCode()">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                  <span>Submit Solution</span>
                </button>
              </div>
            </div>

            <!-- Execution Results / Output Console -->
            <div id="outputConsolePanel" class="console-panel" style="display:none;">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem; border-bottom:1px solid #f1f5f9; padding-bottom:0.65rem; flex-wrap:wrap; gap:0.5rem;">
                <div style="display:flex; align-items:center; gap:0.6rem;">
                  <span id="consoleStatusBadge" class="badge" style="font-weight:700; font-size:0.8rem;">Status</span>
                  <span id="consoleExecutionTime" style="font-size:0.8rem; color:#64748b;"></span>
                </div>
                <div id="consoleScoreBadge" style="font-weight:700; font-size:0.85rem;"></div>
              </div>

              <!-- Compilation Output or Error Message -->
              <div id="compilationSection" style="margin-bottom:0.85rem; display:none;">
                <div style="font-size:0.78rem; font-weight:700; color:#64748b; text-transform:uppercase; margin-bottom:0.3rem;">Compiler Diagnostics:</div>
                <pre id="compilationText" style="background:#0f172a; color:#f87171; padding:0.85rem 1rem; border-radius:8px; font-family:monospace; font-size:0.85rem; white-space:pre-wrap; overflow-x:auto; margin:0;"></pre>
              </div>

              <!-- Test Case Results Tabs -->
              <div id="testCasesTabsContainer" style="display:flex; gap:0.4rem; margin-bottom:0.85rem; flex-wrap:wrap;"></div>

              <!-- Active Test Case Detail Viewer -->
              <div id="activeTestCaseDetails" style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:1rem; font-size:0.88rem;"></div>

              <!-- Final Feedback Message -->
              <div id="consoleFeedbackAlert" style="margin-top:0.85rem; padding:0.85rem 1rem; border-radius:10px; font-size:0.9rem; line-height:1.5;"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/skill-map.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth('STUDENT')) return;
      loadChallengeDetail();
    });
  </script>
</body>
</html>
