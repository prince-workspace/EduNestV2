<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Topic Assessment Quiz — EduNest</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body style="background: #f8fafc;">
  <div class="quiz-page-container">
    <!-- Breadcrumb -->
    <div class="quiz-breadcrumb">
      <span class="quiz-breadcrumb-dot"></span>
      <span id="quizBreadcrumbText">ASSESSMENT &bull; JAVA PROGRAMMING FUNDAMENTALS</span>
    </div>

    <!-- Header: Title + Untimed / Timed Pill -->
    <div class="quiz-header-row">
      <h1 class="quiz-header-title" id="quizTitle">Java Basics Quiz</h1>
      <div id="quizTimer" class="quiz-mode-pill">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span id="quizTimerText">Untimed &bull; Take your time</span>
      </div>
    </div>

    <!-- Progress: Question X of Y | Z% Complete + Bar -->
    <div class="quiz-progress-section">
      <div class="quiz-progress-text-row">
        <span class="quiz-progress-question-count" id="questionProgressText">Question 1 of 5</span>
        <span class="quiz-progress-pct" id="questionProgressPct">20% Complete</span>
      </div>
      <div class="quiz-progress-track">
        <div class="quiz-progress-fill" id="questionProgressBar" style="width: 20%;"></div>
      </div>
    </div>

    <!-- Active Question Card -->
    <div id="questionCardContainer">
      <!-- Populated dynamically -->
    </div>

    <!-- Bottom Actions: Previous Question, Flag for Review, Next Question / Submit -->
    <div class="quiz-action-bar">
      <button class="btn-quiz-prev" id="prevQuestionBtn" onclick="navigateQuestion(-1)" disabled>
        &larr; Previous Question
      </button>

      <button class="btn-quiz-flag" id="flagQuestionBtn" onclick="toggleFlagCurrentQuestion()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
        <span id="flagQuestionText">Flag for review</span>
      </button>

      <button class="btn-quiz-next" id="nextQuestionBtn" onclick="navigateQuestion(1)">
        <span>Next Question</span> &rarr;
      </button>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/quiz.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth('STUDENT')) return;
      initQuizPage('CHAPTER_QUIZ');
    });
  </script>
</body>
</html>
