<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmarks &amp; Notes — EduNest</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-active-nav="saved">
  <div class="app-shell">
    <!-- Left Sidebar -->
    <aside class="app-sidebar" id="sidebarMount"></aside>

    <!-- Main Area -->
    <div class="app-main">
      <header class="app-topbar">
        <div class="topbar-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="globalSearchInput" placeholder="Search saved notes..." />
        </div>
        <div class="topbar-user">
          <div class="topbar-status">
            <span class="topbar-status-dot"></span>
            <span>Online</span>
          </div>
          <a href="/student/profile.html" class="user-avatar-chip" style="text-decoration:none; color:inherit;">
            <div class="user-avatar-circle" id="topUserInitials">ST</div>
            <span id="topUserName">Student</span>
          </a>
        </div>
      </header>

      <main class="app-content">
        <div class="dashboard-header" style="background:#ffffff; border:1px solid #eef2f6; border-radius:14px; padding:1.25rem 1.5rem; margin-bottom:1.25rem;">
          <div>
            <span class="card-question">Personal Study Archive</span>
            <h2 style="margin-top: 0.25rem;">Saved Bookmarks &amp; Notes</h2>
            <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 0.2rem;">
              Quickly jump back to bookmarked lessons and review your personal notes.
            </p>
          </div>
        </div>

        <section style="margin-bottom:2rem;">
          <h3 style="margin-bottom:0.75rem; font-size:1.1rem; color:#0f172a;">★ Bookmarked Lessons</h3>
          <div id="bookmarksContainer" style="display:flex; flex-direction:column; gap:0.75rem;">
            <p style="color:#64748b;">Loading bookmarks...</p>
          </div>
        </section>

        <section>
          <h3 style="margin-bottom:0.75rem; font-size:1.1rem; color:#0f172a;">📝 My Lesson Notes</h3>
          <div id="notesContainer" style="display:flex; flex-direction:column; gap:0.75rem;">
            <p style="color:#64748b;">Loading notes...</p>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/notes-bookmarks.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth('STUDENT')) return;
      loadBookmarksAndNotesHub();
    });
  </script>
</body>
</html>
