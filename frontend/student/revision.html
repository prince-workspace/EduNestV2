<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spaced Revision — EduNest</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-active-nav="dashboard">
  <div class="app-shell">
    <!-- Left Sidebar -->
    <aside class="app-sidebar" id="sidebarMount"></aside>

    <!-- Main Area -->
    <div class="app-main">
      <header class="app-topbar">
        <div class="topbar-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="globalSearchInput" placeholder="Search revisions..." />
        </div>
        <div class="topbar-user">
          <div class="topbar-status">
            <span class="topbar-status-dot"></span>
            <span>Online</span>
          </div>
          <a href="/student/profile.html" class="user-avatar-chip" style="text-decoration:none; color:inherit;">
            <div class="user-avatar-circle" id="topUserInitials">ST</div>
            <span id="topUserName">Student</span>
          </a>
        </div>
      </header>

      <main class="app-content">
        <div class="dashboard-header" style="margin-bottom:1.25rem;">
          <div>
            <span class="card-question">Spaced Repetition (1-Day → 3-Day → 7-Day Intervals)</span>
            <h2 style="margin-top: 0.25rem;">Targeted Revision Queue</h2>
            <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 0.2rem;">
              Weak and Needs-Practice topics are scheduled for spaced reviews (<strong>25% weight</strong> in Topic Mastery).
            </p>
          </div>
          <div style="display:flex; gap:1.5rem; text-align:center;">
            <div>
              <span style="font-size:0.75rem; color:var(--text-muted); font-weight:700;">PENDING</span>
              <h2 id="pendingRevCount" style="color:var(--needs-work); font-size:1.6rem; margin-top:0.15rem;">0</h2>
            </div>
            <div>
              <span style="font-size:0.75rem; color:var(--text-muted); font-weight:700;">COMPLETED</span>
              <h2 id="completedRevCount" style="color:var(--strong); font-size:1.6rem; margin-top:0.15rem;">0</h2>
            </div>
          </div>
        </div>

        <h3 style="margin-bottom: 0.75rem; font-size:1.1rem; color:var(--text-main);">Upcoming &amp; Due Revision Tasks</h3>
        <div id="pendingRevisionsList" style="margin-bottom: 2rem;"></div>

        <h3 style="margin-bottom: 0.75rem; font-size:1.1rem; color:#0f172a;">Completed Revision History</h3>
        <div id="completedRevisionsList"></div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/revision.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth('STUDENT')) return;
      loadRevisionPage();
    });
  </script>
</body>
</html>
