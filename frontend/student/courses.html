<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course Catalog — EduNest</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar"></nav>

  <div class="container">
    <div class="dashboard-header">
      <div>
        <h2>Course Catalog &amp; My Enrollments</h2>
        <p style="color: var(--text-muted); font-size: 0.92rem;">
          Enroll in a course to unlock its Diagnostic Assessment and personalized topic mastery tracking.
        </p>
      </div>
      <div>
        <input type="text" id="courseSearch" class="form-control" style="width: 280px;"
               placeholder="Search courses by title or keyword..." oninput="filterCourses()" />
      </div>
    </div>

    <h3 style="margin-bottom: 1rem;">My Enrolled Courses</h3>
    <div id="myCoursesGrid" class="grid-2" style="margin-bottom: 2.25rem;"></div>

    <h3 style="margin-bottom: 1rem;">All Available Courses</h3>
    <div id="catalogGrid" class="grid-2"></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/courses.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth('STUDENT')) return;
      loadCourseCatalog();
    });
  </script>
</body>
</html>
