<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Concept Practice — EduNest</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar">
    <a href="/student/dashboard.html" class="brand">🎓 <span>EduNest</span></a>
    <div class="nav-links">
      <a href="/student/dashboard.html">Dashboard</a>
      <a href="/student/courses.html">Courses</a>
      <span class="badge badge-student">PRACTICE MODE</span>
      <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="container" style="max-width: 860px;">
    <div class="dashboard-header">
      <div>
        <span class="card-question">Untimed Concept Practice · Instant Feedback</span>
        <h2 id="quizTitle" style="margin-top: 0.25rem;">Loading Practice Questions...</h2>
        <p style="color: var(--text-muted); font-size: 0.92rem; margin-top: 0.25rem;">
          Select any option to receive immediate feedback and explanations before taking the graded Topic Quiz.
        </p>
      </div>
      <span id="questionCountBadge" class="badge badge-student">0 Questions</span>
    </div>

    <div id="questionsContainer"></div>

    <div style="display:flex; justify-content:space-between; margin-top: 1.5rem;">
      <a href="/student/courses.html" class="btn btn-outline">← Back to Course</a>
      <button class="btn btn-primary" onclick="submitCurrentQuiz()">
        Record Practice Session →
      </button>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/quiz.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth('STUDENT')) return;
      initQuizPage('PRACTICE');
    });
  </script>
</body>
</html>
